name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Analyze the planted demo estate
        run: node dist/src/cli.js analyze site/sample.inventory.json --out sample.out.json

      - name: Validate the output against the published schema
        run: node scripts/check-inventory.ts sample.out.json

      # Also run by `npm test`; its own step so a stale Cronsole catalog is named in the run.
      - name: Cronsole catalog in registry/ is current
        run: node scripts/build-registry.ts --check
